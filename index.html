<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ring the Bell</title>
  <style>
    :root {
      --bg1: #0b1020; /* deep slate-indigo */
      --bg2: #0e1530;
      --indigo: #6366f1;
      --indigo-2: #4f46e5;
      --card: rgba(255,255,255,0.06);
      --card-border: rgba(255,255,255,0.12);
      --text: #e5e7eb;
      --muted: #a5b4fc;
      --danger: #fecaca;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: radial-gradient(80vw 80vh at 10% 10%, #1f2547 0%, transparent 60%),
                  radial-gradient(70vw 70vh at 90% 10%, #232a55 0%, transparent 60%),
                  linear-gradient(135deg, var(--bg1), var(--bg2));
      display: grid; place-items: center; padding: 24px;
    }
    .card {
      width: min(680px, 100%);
      background: backdrop-filter: blur(12px);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px; padding: 24px 24px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 32px); letter-spacing: -0.02em; }
    p.sub { margin: 0 0 18px; color: #c7cbe6; }

    /* Controls row */
    .row { display: grid; gap: 12px; grid-template-columns: 1fr; }
    @media (min-width: 720px) { .row { grid-template-columns: auto 1fr; align-items: center; } }

    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border-radius: 999px; padding: 10px 14px; cursor: pointer;
      transition: transform .06s ease, background .2s ease;
      user-select: none;
    }
    .btn:hover { background: rgba(255,255,255,0.12); }
    .btn:active { transform: scale(0.98); }

    .range { width: 100%; }
    .range input[type="range"] { width: 100%; }

    /* Big bell button */
    .center { display: grid; place-items: center; padding: 20px 0 8px; }
    .bell-btn {
      position: relative; height: clamp(200px, 28vw, 260px); width: clamp(200px, 28vw, 260px);
      border-radius: 999px; cursor: pointer; border: 1px solid var(--card-border);
      background: linear-gradient(180deg, var(--indigo), var(--indigo-2));
      box-shadow:
        0 10px 30px rgba(79,70,229,0.45),
        inset 0 8px 30px rgba(255,255,255,0.16),
        inset 0 -10px 20px rgba(0,0,0,0.2);
      display: grid; place-items: center;
      transition: transform .07s ease;
      outline-offset: 6px;
    }
    .bell-btn:hover::after { opacity: .16; }
    .bell-btn:active { transform: scale(0.97); }
    .bell-btn::after {
      content: ""; position: absolute; inset: 0; border-radius: 999px;
      background: radial-gradient(60% 60% at 50% 40%, rgba(255,255,255,0.25), transparent 60%);
      opacity: .1; transition: opacity .25s ease;
    }
    .bell-icon { width: clamp(64px, 10vw, 88px); height: auto; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.35)); }

    /* Pulse ring when ringing */
    .pulse { position: absolute; inset: -10%; border-radius: 999px; border: 2px solid rgba(165,180,252,0.45); animation: pulse 700ms ease-out forwards; }
    @keyframes pulse { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.25); } }

    .footer { text-align: center; color: #b8bce2; font-size: 14px; padding-top: 8px; min-height: 24px; }

    /* Inputs zone */
    .inputs { display: grid; gap: 10px; margin-top: 16px; }
    @media (min-width: 720px) {
      .inputs { grid-template-columns: 1fr auto; align-items: center; }
    }
    .url-input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.06); color: var(--text); }
    .file-input { display: inline-block; }
    .hint { color: #c7cbe6; font-size: 13px; margin-top: 6px; }
    .status { font-size: 14px; margin-top: 6px; }
    .status.error { color: var(--danger); }
    .status.ok { color: #c7facc; }
    .kbd { padding: 2px 6px; border-radius: 6px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.06); font-size: 12px; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <header>
      <h1>Ring the Bell</h1>
      <p class="sub">Click the big button or press <span class="kbd">Space</span>/<span class="kbd">Enter</span>. Default sound: <code>sounds/bell.wav</code></p>
    </header>

    <section class="row" aria-label="Sound controls">
      <button id="muteBtn" class="btn" aria-pressed="false" aria-label="Toggle mute">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M11 5L6 9H3v6h3l5 4V5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="muteX" d="M16 9l4 4m0-4l-4 4" stroke="transparent" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span id="muteLabel">Sound On</span>
      </button>
      <div class="range" title="Volume">
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Volume" />
      </div>
    </section>

    <div class="center">
      <button id="bellBtn" class="bell-btn" aria-label="Ring the bell">
        <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"/>
          <path d="M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
        <!-- pulse ring injected by JS -->
      </button>
    </div>

    <div class="footer" id="statusText">Loading sound…</div>

    <section aria-label="Choose custom sound">
      <div class="inputs">
        <input id="urlInput" class="url-input" type="url" placeholder="Or paste an audio URL (e.g., https://example.com/bell.mp3)" />
        <button id="useUrlBtn" class="btn" aria-label="Use URL">Use URL</button>
      </div>
      <div class="inputs" style="grid-template-columns: auto auto;">
        <label class="btn file-input" for="fileInput" aria-label="Upload an audio file">
          <input id="fileInput" type="file" accept="audio/*" hidden />
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Upload Audio
        </label>
        <button id="resetBtn" class="btn" aria-label="Reset to default">Reset to Default</button>
      </div>
      <div class="hint">Supported: most common audio formats. Some remote URLs may require CORS permissions from their server to play.</div>
      <div id="srcStatus" class="status"></div>
    </section>
  </main>

  <!-- Hidden audio element -->
  <audio id="bellAudio" preload="auto"></audio>

  <script>
    (function() {
      const bellBtn = document.getElementById('bellBtn');
      const audio = document.getElementById('bellAudio');
      const volume = document.getElementById('volume');
      const muteBtn = document.getElementById('muteBtn');
      const muteLabel = document.getElementById('muteLabel');
      const muteX = document.getElementById('muteX');
      const statusText = document.getElementById('statusText');
      const fileInput = document.getElementById('fileInput');
      const urlInput = document.getElementById('urlInput');
      const useUrlBtn = document.getElementById('useUrlBtn');
      const resetBtn = document.getElementById('resetBtn');
      const srcStatus = document.getElementById('srcStatus');

      // Keep track of object URLs to revoke later
      let currentObjectUrl = null;

      const DEFAULT_SRC = 'sounds/bell.mp3';

      function setStatus(msg, type) {
        statusText.textContent = msg || '';
        statusText.className = 'footer' + (type ? ' ' + type : '');
      }
      function setSrcStatus(msg, isError) {
        srcStatus.textContent = msg || '';
        srcStatus.className = 'status ' + (isError ? 'error' : 'ok');
      }

      function setAudioSrc(src, label) {
        try {
          if (currentObjectUrl) {
            URL.revokeObjectURL(currentObjectUrl);
            currentObjectUrl = null;
          }
          audio.src = src;
          audio.load();
          audio.currentTime = 0;
          setSrcStatus('Sound source: ' + (label || src), false);
          audio.dispatchEvent(new Event('sourcechange'));
        } catch(e) {
          setSrcStatus('Could not set audio source.', true);
        }
      }

      function ring() {
        if (!audio.src) return;
        try {
          audio.currentTime = 0;
          audio.play().then(() => {
            pulse();
            if (navigator.vibrate) navigator.vibrate(20);
            setStatus('Ringing…');
            setTimeout(() => setStatus('Ready.'), 750);
          }).catch(err => {
            setStatus('Tap the button once to allow audio playback.', 'error');
          });
        } catch (e) {
          setStatus('Unable to play sound.', 'error');
        }
      }

      function pulse() {
        const ring = document.createElement('span');
        ring.className = 'pulse';
        bellBtn.appendChild(ring);
        setTimeout(() => ring.remove(), 700);
      }

      // Initialize
      audio.addEventListener('canplaythrough', () => setStatus('Ready.'), { once: true });
      audio.addEventListener('error', () => setStatus("Couldn't load sound. Check sounds/bell.mp3", 'error'), { once: true });
      setAudioSrc(DEFAULT_SRC, 'Default (sounds/bell.mp3)');

      // Volume & mute
      audio.volume = parseFloat(volume.value);
      volume.addEventListener('input', (e) => {
        audio.volume = parseFloat(e.target.value);
      });
      muteBtn.addEventListener('click', () => {
        audio.muted = !audio.muted;
        muteBtn.setAttribute('aria-pressed', String(audio.muted));
        muteLabel.textContent = audio.muted ? 'Muted' : 'Sound On';
        muteX.setAttribute('stroke', audio.muted ? 'currentColor' : 'transparent');
      });

      // Big button
      bellBtn.addEventListener('click', ring);

      // Keyboard: Space or Enter anywhere (except in inputs)
      document.addEventListener('keydown', (e) => {
        const t = e.target;
        const isEditable = (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable));
        if (isEditable) return;
        if (e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          ring();
        }
      });

      // File upload
      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        if (!file.type.startsWith('audio/')) {
          setSrcStatus('Selected file is not an audio file.', true);
          return;
        }
        currentObjectUrl = URL.createObjectURL(file);
        setAudioSrc(currentObjectUrl, 'Uploaded: ' + (file.name || 'audio'));
      });

      // URL load
      useUrlBtn.addEventListener('click', async () => {
        const url = (urlInput.value || '').trim();
        if (!url) { setSrcStatus('Enter a valid audio URL.', true); return; }
        try {
          // Basic validation
          const u = new URL(url, window.location.origin);
          setAudioSrc(u.href);
        } catch (e) {
          setSrcStatus('That URL looks invalid.', true);
        }
      });

      // Reset
      resetBtn.addEventListener('click', () => {
        urlInput.value = '';
        setAudioSrc(DEFAULT_SRC, 'Default (sounds/bell.mp3)');
      });
    })();
  </script>
</body>
</html>
